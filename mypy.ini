[mypy]
# ── Project layout ────────────────────────────────────────────────────────────
python_version = 3.10
explicit_package_bases = True

# ── Strictness ────────────────────────────────────────────────────────────────
warn_unused_configs = True
warn_return_any = False
warn_unused_ignores = True

# ── Third-party packages with no stubs / no py.typed marker ──────────────────

[mypy-nltk]
ignore_missing_imports = True

[mypy-nltk.*]
ignore_missing_imports = True

[mypy-pytesseract]
ignore_missing_imports = True

[mypy-whisper]
ignore_missing_imports = True

[mypy-playsound]
ignore_missing_imports = True

[mypy-pdfplumber]
ignore_missing_imports = True

[mypy-docx]
ignore_missing_imports = True

[mypy-cv2]
ignore_missing_imports = True

[mypy-sentence_transformers]
ignore_missing_imports = True

[mypy-llama_index.*]
ignore_missing_imports = True

[mypy-groq]
ignore_missing_imports = True

[mypy-flask_cors]
ignore_missing_imports = True

[mypy-prompt]
ignore_missing_imports = True
